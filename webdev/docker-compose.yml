services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bizzcheck}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # DB port NOT exposed externally — only accessible inside Docker network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "4001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4001
      # DSN-ul backendului. Forma e `${DATABASE_URL:-<valoarea calculată>}`, adică:
      #   • fără DATABASE_URL în .env → exact valoarea de dinainte (superuserul
      #     `postgres` din DB_USER/DB_PASSWORD) — nimic nu se schimbă;
      #   • cu DATABASE_URL în .env  → aceea câștigă și e SINGURA credențială DB
      #     care ajunge în containerul backend (DB_PASSWORD nu mai e pasat nicăieri
      #     către backend, deci `docker inspect backend` nu mai arată superuserul).
      # Asta face procedura din backend/DATABASE_ROLE.md (rol dedicat `bizcheck_app`,
      # non-superuser) să funcționeze efectiv. ÎNAINTE, literalul era calculat fix și
      # `.env` era folosit DOAR pentru substituția ${...} — niciun serviciu nu are
      # `env_file:` — deci `echo "DATABASE_URL=..." >> .env` era un no-op silențios:
      # operatorul credea că a scos superuserul, dar backendul se conecta la fel.
      # ⚠ DB_USER/DB_PASSWORD rămân ale serviciului `db` (POSTGRES_USER/PASSWORD la
      #   initdb + pg_isready). NU pune `DB_USER=bizcheck_app` în .env.
      # ⚠ Substituția imbricată în default e suportată de Docker Compose v2
      #   (compose-go, getFirstBraceClosingIndex → potrivire pe acolade echilibrate);
      #   verificată cu binarul real v2.39.1 și blocată de
      #   scripts/validate-deploy-config.py ca să nu regreseze.
      # ⚠ Parola din DATABASE_URL nu are voie să conțină `$` — Compose l-ar
      #   interpreta ca variabilă și ar TRUNCHIA parola în tăcere.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-bizzcheck}}
      # ── Pool-ul de conexiuni (database/db.py) ──
      # Defaulturile din cod sunt 2 / 10; le repetăm aici ca .env să le poată
      # schimba efectiv (până acum nu erau pasate deloc → orice DB_POOL_MAX din
      # .env era un no-op silențios, iar scripts/check-db-role.sh calcula
      # CONNECTION LIMIT pe o valoare pe care backendul n-o vedea niciodată).
      # ⚠ Se citesc cu int(), deci valoarea nu are voie să ajungă GOALĂ în
      #   container — de aceea `:-` (gol SAU nesetat → default), nu `-`. Un
      #   `DB_POOL_MAX=` gol în .env ar arunca ValueError la import și backendul
      #   ar intra în restart-loop, fără cauză vizibilă în deploy.sh.
      # ⚠ Plafonul REAL de conexiuni e 4 (workeri gunicorn) × DB_POOL_MAX = 40,
      #   nu DB_POOL_MAX. Dacă urci valoarea, urcă și `CONNECTION LIMIT` al
      #   rolului aplicației (backend/DATABASE_ROLE.md, ./scripts/check-db-role.sh).
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me_in_production}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-change_me_fernet_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
      # Anti Host-Header-Injection: only these Host values are accepted (others → 400).
      # Blocks direct-IP probing. `backend` is the internal Docker service name the
      # tgbot uses (http://backend:4001), so it MUST stay in the list. Override in
      # .env if the domain changes.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-bizcheck.com.ua,www.bizcheck.com.ua,backend,localhost,127.0.0.1}
      # Base URL used to build the report download link inside report emails.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://bizcheck.com.ua}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?set it to the handle of the bot whose TELEGRAM_BOT_TOKEN you configured}
      # SMTP (Office 365) — leave SMTP_PASSWORD empty to disable email delivery.
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Crowe Turcan Mikhailenko}
      # TODO(UA): pune adresa reală de contact pentru piața Ucraina în .env.
      # Defaultul de mai jos e un PLACEHOLDER — nu există încă o cutie poștală pe
      # bizcheck.com.ua, iar o adresă .ua inventată ar trimite răspunsurile
      # clienților în gol. Nu porni în producție fără SMTP_REPLY_TO setat în .env.
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-office@example.ua}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://bizcheck.com.ua/logo_email.png}
      # ── Identitatea din subsolul emailului (services/email_templates.py) ──
      # ⚠ Defaulturile DIN SURSĂ sunt încă MOLDOVENEȘTI: office@bizcheck.md,
      #   https://crowe-tm.md, https://t.me/CROWE_TM, @CROWE_TM. Nu erau pasate
      #   deloc prin compose, deci `EMAIL_REPLY_TO=…` scris în .env era un no-op
      #   silențios (niciun serviciu nu are `env_file:`) și fiecare email de
      #   raport pleca cu identitatea .md. Acum .env câștigă — completează-le
      #   imediat ce există contactele UA.
      # ⚠ Forma `${VAR:-<defaultul din cod>}` e obligatorie aici: valorile sunt
      #   argumente IMPLICITE de funcție, citite o singură dată la import. Un
      #   `${VAR:-}` gol le-ar suprascrie cu "" → mailto:/href goale în email.
      #   Cu `:-`, o linie goală în .env (`EMAIL_REPLY_TO=`) revine la default.
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-office@bizcheck.md}
      EMAIL_SITE_URL: ${EMAIL_SITE_URL:-https://crowe-tm.md}
      EMAIL_TELEGRAM_URL: ${EMAIL_TELEGRAM_URL:-https://t.me/CROWE_TM}
      EMAIL_TELEGRAM_HANDLE: "${EMAIL_TELEGRAM_HANDLE:-@CROWE_TM}"
      # Linkul „Politica de confidențialitate" din email. Defaultul din cod e
      # `<PUBLIC_BASE_URL>/confidentialitate` — o rută LEGACY, care în nginx.conf
      # face 301 către /uk/privacy. Aici ținta e direct cea canonică.
      EMAIL_PRIVACY_URL: ${EMAIL_PRIVACY_URL:-${PUBLIC_BASE_URL:-https://bizcheck.com.ua}/uk/privacy}
      # Sales-team Telegram notification (private group with the notifier bot).
      # Leave SALES_BOT_TOKEN empty to disable. SALES_CHAT_ID = group id (negative).
      SALES_BOT_TOKEN: ${SALES_BOT_TOKEN:-}
      SALES_CHAT_ID: ${SALES_CHAT_ID:-}
      # Forum topic (message_thread_id) where ALL "Lead nou" notifications go.
      # Set to the "Lead/Client Chat bot" topic id. Empty → per-test topics / General.
      SALES_TOPIC_ID: ${SALES_TOPIC_ID:-}
      # Ritmul cu care services/sales_notify.py postează în grup. Goale =
      # defaulturile din cod (3.0 s între mesaje ≈ 20 msg/min, limita Telegram
      # pentru grupuri; 4 reîncercări la 429). Erau citite din mediu, dar nu
      # ajungeau în container — deci netunabile fără rebuild.
      SALES_SEND_SPACING_SEC: ${SALES_SEND_SPACING_SEC:-}
      SALES_MAX_SEND_RETRY: ${SALES_MAX_SEND_RETRY:-}
      # BizCheck bot token — backend uses it to send the feedback question
      # directly (services/telegram_send.py). SAME token as the tgbot service.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Shared secret guarding the bot-only feedback endpoints (/tg/feedback/*).
      # Must match the value on the tgbot service. Leave empty to run ungated.
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-}
      # ── Rollout etapizat al lui X-Bot-Secret pe /tg/contact, /tg/email,
      #    /tg/lead (routes/telegram.py) — endpointuri care SCRIU date personale.
      # "0" (implicit) = comportamentul de AZI: un apelant fără header e ACCEPTAT
      #                  și se loghează doar un warning (fail-open).
      # "1"            = header obligatoriu; lipsa lui → 403. (Un header PREZENT
      #                  dar greșit dă 403 în ambele moduri.)
      # Până acum variabila nu era pasată, deci flagul NU putea fi activat din
      # .env sub nicio formă → cele trei rute rămâneau permanent fail-open.
      # CUTOVER: pune-l pe "1" DUPĂ ce backend + tgbot rulează cu ACELAȘI
      # BOT_SHARED_SECRET nevid, altfel botul primește 403 la livrarea rapoartelor.
      TG_REQUIRE_BOT_SECRET: ${TG_REQUIRE_BOT_SECRET:-0}
      # ── Stocarea contoarelor de rate-limit (server.py) ──
      # GOL (implicit) = `memory://`: contor SEPARAT în fiecare din cele 4 procese
      # gunicorn, deci plafonul efectiv e ~4× cel nominal (200/min per IP devine
      # ~800/min) și se resetează la fiecare redeploy. Acceptabil la traficul de
      # azi. Pentru limite exacte: adaugă un serviciu `redis` aici și pune
      # RATELIMIT_STORAGE_URI=redis://redis:6379/0 în .env — codul îl onorează deja.
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-}
      # Background loop that sends due feedback questions. "1" (default) = on,
      # "0" = off. Only set to "0" to disable the scheduler entirely.
      FEEDBACK_SCHEDULER: ${FEEDBACK_SCHEDULER:-1}
      # ── Spool pentru joburile de export (services/export_jobs.py) ──
      # Calea DIN CONTAINER e fixată aici, nu în .env: trebuie să fie identică cu
      # ținta bind mountului de mai jos. Ce se configurează din .env e partea de
      # GAZDĂ (EXPORT_SPOOL_HOST_DIR). Fără variabila asta modulul ar scrie în
      # /tmp, adică în stratul de scriere al containerului (arhive de ~1,6 GB la
      # 500 de submisii → container umflat, date pierdute la recreare, disc plin
      # invizibil în `docker system df`).
      EXPORT_SPOOL_DIR: /var/spool/bizcheck_exports
      # TTL-uri de curățenie (secunde). sweep() rulează inline la create/status/
      # download și după fiecare job — nu e nevoie de cron pentru cazul normal.
      EXPORT_JOB_READY_TTL: ${EXPORT_JOB_READY_TTL:-3600}
      EXPORT_JOB_DOWNLOADED_TTL: ${EXPORT_JOB_DOWNLOADED_TTL:-600}
      EXPORT_JOB_FAILED_TTL: ${EXPORT_JOB_FAILED_TTL:-1800}
      EXPORT_JOB_STALE_AFTER: ${EXPORT_JOB_STALE_AFTER:-900}
    volumes:
      # BIND MOUNT, nu volum numit — intenționat.
      #   * Arhivele sunt uriașe (1,6 GB / 500 submisii) și strict temporare.
      #     Operatorul trebuie să le poată VEDEA și șterge de pe gazdă, fără să
      #     intre în container:  du -sh webdev/export_spool  /  ./scripts/export-spool.sh
      #   * Pe multe VPS-uri /var/lib/docker (unde ar sta un volum numit) e pe
      #     partiția root, mică. Cu bind mount muți spoolul pe alt disc doar
      #     schimbând EXPORT_SPOOL_HOST_DIR în .env — fără să atingi compose-ul.
      #   * Persistența pe care o dă un volum numit nu are valoare aici: un job
      #     supraviețuiește oricum recreării containerului (state.json + arhiva
      #     sunt în același director), iar restul e gunoi pe care îl vrei ușor de
      #     aruncat, nu conservat de Docker.
      #   ⚠ Directorul e EXCLUS din contextul de build (webdev/.dockerignore) și
      #     din git (.gitignore). Nu-l muta sub backend/ — acolo ar intra în
      #     `COPY . .` la build.
      #   ⚠ SCALARE: spoolul e LOCAL containerului. Dacă backendul se scalează la
      #     mai multe replici (deploy --scale backend=N, swarm, k8s), un job creat
      #     de replica A e „unknown job" pentru replica B, iar descărcarea pică
      #     aleatoriu. Cele 4 procese gunicorn DIN acest container partajează
      #     corect directorul — problema apare abia la al doilea CONTAINER.
      #     Atunci EXPORT_SPOOL_DIR trebuie mutat pe storage partajat (NFS/GlusterFS)
      #     montat identic în fiecare replică.
      - ${EXPORT_SPOOL_HOST_DIR:-./export_spool}:/var/spool/bizcheck_exports
    # Health probe. python:3.12-slim nu are curl/wget, deci folosim stdlib —
    # zero pachete în plus în imagine. /api/health e scutit de verificarea
    # ALLOWED_HOSTS (server.py), deci merge și cu Host: 127.0.0.1.
    # Endpointul face un `SELECT 1` real (routes/health.py) și răspunde 503 dacă
    # Postgres nu e accesibil → urlopen ridică HTTPError → containerul devine
    # unhealthy. Probe-ul DB are un plafon intern de 3s, de aceea timeout-urile
    # de aici sunt mai mari (altfel am marca unhealthy o bază doar lentă).
    # start_period acoperă migrarea DB de la boot (migrate() în database/db.py).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/api/health', timeout=8)\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Variabile citite la BUILD-TIME de `npm run build` (Vite + generatoarele de
      # sitemap/prerender). `environment:` nu ajută aici — acela e runtime-ul lui
      # nginx, iar bundle-ul e deja compilat. Vezi comentariile din Dockerfile.frontend.
      # Toate au default GOL: un build fără ele reușește, doar loghează avertismentul.
      args:
        # https://bizcheck.com.ua/api_crowe_bizcheck — fără el sitemap.xml și
        # HTML-ul pre-randat conțin doar rutele statice (test/ și templates/ lipsesc).
        # Se rezolvă din rețeaua containerului de build, deci trebuie URL PUBLIC.
        SITEMAP_API_URL: ${SITEMAP_API_URL:-}
        # Doar pentru build-uri de staging pe alt domeniu. Gol → https://bizcheck.com.ua.
        SITEMAP_BASE_URL: ${SITEMAP_BASE_URL:-}
        # Gol → SPA-ul folosește calea relativă /api_crowe_bizcheck prin nginx (corect
        # în producție). Se setează doar dacă API-ul stă pe alt origin.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    # Legat doar la 127.0.0.1: reverse-proxy-ul (nginx_proxy) ajunge la container prin
    # rețeaua Docker (webdev-frontend-1:80), NU prin host. Astfel portul nu mai e expus
    # public (finding pentest „Port 5174 dev server открыт").
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    volumes:
      # ── Masca de pre-lansare (Basic Auth + noindex) ─────────────────────────
      # BIND MOUNT read-only. Conține două fișiere, ambele generate PE SERVER și
      # ținute în afara git-ului (webdev/.gitignore):
      #   mask.conf  — prezența lui = masca e PORNITĂ. Conține auth_basic +
      #                add_header X-Robots-Tag "noindex…". Un singur fișier =
      #                un singur comutator: nu poți scoate parola și uita noindex-ul.
      #   htpasswd   — perechile user/parolă (apr1/bcrypt). NICIODATĂ în repo.
      # Se administrează exclusiv cu:  ./scripts/site-mask.sh on|off|status|adduser
      #
      # De ce mount și nu ceva copiat în imagine: `nginx.conf` e COPIAT la build
      # (Dockerfile.frontend), deci orice schimbare în el cere rebuild + redeploy.
      # Comutarea măștii trebuie să fie instantanee (`nginx -s reload`), altfel
      # „scoate parola la lansare" devine o operațiune de deploy cu rollback.
      #
      # Directorul poate lipsi: `include /etc/nginx/maintenance/*.conf` cu glob
      # fără potriviri e valid în nginx, deci containerul pornește oricum.
      # `:ro` — nginx nu are de ce să scrie acolo.
      - ./nginx-maintenance:/etc/nginx/maintenance:ro
    depends_on:
      # INTENȚIONAT service_started, NU service_healthy: SPA-ul e static și
      # trebuie să se ridice chiar dacă backendul e picat (utilizatorul vede
      # site-ul, nu o pagină moartă). Condiția e scrisă explicit ca să nu mai
      # fie ambiguă. Ordinea de pornire rămâne backend → frontend.
      backend:
        condition: service_started
    # nginx:alpine are busybox wget (nu are curl). Cererea pleacă cu
    # Host: 127.0.0.1 → nu declanșează redirectul www→non-www din nginx.conf,
    # iar lipsa lui X-Forwarded-Proto nu declanșează redirectul spre https.
    #
    # ⚠ Ținta e `/healthz`, NU `/`. `/` intră sub masca de pre-lansare (Basic
    #   Auth) → ar răspunde 401 → busybox wget iese non-zero → container
    #   „unhealthy" → deploy.sh ar face ROLLBACK la fiecare deploy cu masca
    #   pornită. `/healthz` e o locație `=` fără mască, care servește tot
    #   index.html (deci verifică în continuare că build-ul SPA-ului e prezent).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  tgbot:
    build: ./tgbot
    restart: unless-stopped
    depends_on:
      # Boții cheamă backendul imediat la pornire → merită să aștepte healthy.
      backend:
        condition: service_healthy
    # Botul e un proces de long-polling, fără server HTTP propriu: nu are ce
    # expune. Probăm ce contează pentru funcția lui — că ajunge la backend.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://backend:4001/api/health', timeout=8)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # TELEGRAM_BOT_USERNAME nu apare aici: botul nu-l citește (deep-linkurile se
      # construiesc în backend/services/telegram_send.py). Garda `:?` de pe serviciul
      # `backend` oprește oricum tot stackul dacă lipsește — compose evaluează
      # interpolările pe întregul fișier, nu per serviciu.
      BACKEND_URL: http://backend:4001
      # Must match BOT_SHARED_SECRET on the backend service.
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-}
      # ── Brand + adresa de suport din MESAJELE botului ──
      # tgbot/config.py le citește și strings.py le interpolează ca {site} /
      # {contact} în fiecare text trimis clientului.
      # ⚠ Defaultul din sursă pentru CONTACT_EMAIL e încă office@bizcheck.md
      #   (moldovenesc), iar variabila nu era pasată deloc → botul ucrainean
      #   dădea clienților adresa .md orice ai fi scris în .env. Setează
      #   CONTACT_EMAIL în .env imediat ce există o cutie poștală .ua.
      # ⚠ `:-`, nu `-`: un `CONTACT_EMAIL=` gol în .env ar lăsa mesajele fără
      #   nicio adresă de contact în loc să revină la default.
      SITE_NAME: ${SITE_NAME:-Bizcheck.com.ua}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-office@bizcheck.md}

  # Internal team bot (private group). Polls SALES_BOT_TOKEN for /excel and /pdf;
  # the backend uses the SAME token only to *send* notifications (no poll conflict).
  groupbot:
    build: ./groupbot
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://backend:4001/api/health', timeout=8)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      SALES_BOT_TOKEN: ${SALES_BOT_TOKEN:-}
      SALES_CHAT_ID: ${SALES_CHAT_ID:-}
      BACKEND_URL: http://backend:4001
      # Must match BOT_SHARED_SECRET on the backend. REQUIRED for exports to work.
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-}
      # Link shown by /pdf (bulk PDFs are downloaded from the admin panel, not Telegram).
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL:-https://bizcheck.com.ua/admin_bizcheck_md_crowe/}

volumes:
  pgdata:
