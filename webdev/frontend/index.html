<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#011E41" />

    <!-- LCP preload: the hero laptop is the landing's LCP element but lives in a
         React component, so it is otherwise discovered only after the whole
         module graph renders. Guarded to the landing routes (`/`, `/uk`, `/en`)
         — the same shell serves every SPA route, and pushing 270 KB of unused
         WebP at /uk/test/<slug> would be a net loss. `/` is included because it
         redirects to the landing without a new document load. `type` makes
         non-WebP browsers skip the hint. -->
    <script>
      (function(){try{if(!/^\/(uk\/?|en\/?)?$/.test(location.pathname))return;var l=document.createElement('link');l.rel='preload';l.as='image';l.type='image/webp';l.href='/images/hero/laptop.webp';l.fetchPriority='high';document.head.appendChild(l)}catch(e){}})();
    </script>

    <!-- Warms DNS+TLS for the Meta Pixel below. No `crossorigin` — fbevents.js is
         injected as a plain <script src> (non-anonymous connection pool). -->
    <link rel="preconnect" href="https://connect.facebook.net" />

    <!-- Primary meta -->
    <title>Оцінка ризиків бізнесу онлайн · Bizcheck.com.ua</title>
    <meta name="description" content="Безкоштовна онлайн-оцінка ризиків бізнесу за методологією Crowe: тест за блоками, детальний PDF-звіт і юридичні шаблони для МСБ. Пройдіть тест зараз." />

    <meta name="author" content="Crowe Turcan Mikhailenko" />

    <link rel="canonical" href="https://bizcheck.com.ua/uk/" />

    <link rel="alternate" hreflang="en" href="https://bizcheck.com.ua/en/" />
    <link rel="alternate" hreflang="x-default" href="https://bizcheck.com.ua/uk/" />

    <!-- Social card 1200x630 (public/og-image.png). Absolute URL is required by
         Facebook/LinkedIn — a relative path is silently dropped by the scraper.
         Keep in sync with DEFAULT_IMAGE* in src/config/siteMeta.ts. -->
    <meta property="og:image" content="https://bizcheck.com.ua/og-image.png" />

    <!-- Favicons. Every file below is generated from the Crowe pyramid mark on an
         opaque Crowe Indigo (#011E41) square — apple-touch-icon cannot be
         transparent (iOS fills it black) and Android maskable icons show
         artefacts when they are. The declared sizes match the real pixels;
         regenerate with the same source (public/logo_email.png) if the brand
         mark ever changes. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];

      // Consimțământ hibrid: userii reali sunt gated de banner (GDPR), dar botul Facebook
      // și iframe-ul Event Setup Tool primesc auto-grant ca Meta să detecteze pixelul.
      var __fbAutoGrant = false;
      try {
        var ua = navigator.userAgent || '';
        var isFbBot = /facebookexternalhit|Facebot|Meta-ExternalAgent|FacebookBot/i.test(ua);
        var inFbFrame = (window.top !== window.self) && /facebook\.(com|net)/.test(document.referrer);
        __fbAutoGrant = isFbBot || inFbFrame;
      } catch (e) { __fbAutoGrant = /facebook\.(com|net)/.test(document.referrer); }
      fbq('consent', __fbAutoGrant ? 'grant' : 'revoke');
      fbq('init', '109349254');
