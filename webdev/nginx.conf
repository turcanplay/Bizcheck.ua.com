# ═══════════════════════════════════════════════════════════════════════════
#  BizCheck — nginx pentru SPA + proxy către backend
#  Fișierul e montat ca /etc/nginx/conf.d/default.conf (deci context `http`).
#
#  TLS NU se termină aici. În fața acestui container stă un reverse-proxy
#  extern (`nginx_proxy`) care ține certificatele Let's Encrypt. Configul
#  recomandat pentru ACEL proxy (443 ssl + http2 + redirect 80→443) e
#  versionat separat în `nginx-proxy.conf.example` — vezi acolo.
#
#  Din acest motiv aici NU există `listen 443 ssl` și nici `http2 on`:
#  proxy-ul din față vorbește HTTP/1.1 în clar pe rețeaua Docker. Redirectul
#  http→https se face condiționat, pe baza X-Forwarded-Proto (dacă proxy-ul
#  nu trimite headerul, nu se redirecționează nimic → setup-ul actual rămâne
#  funcțional).
# ═══════════════════════════════════════════════════════════════════════════

server {
    server_tokens off;  # hide nginx version (CWE-200)
    listen 80 default_server;
    server_name bizcheck.ua.com www.bizcheck.ua.com;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # ─── Compresie ──────────────────────────────────────────────────────────
    # nginx:alpine vine cu gzip OFF. Fără asta HTML/CSS/JS pleacă necomprimate.
    # text/html e mereu comprimat implicit și NU se pune în gzip_types.
    gzip on;
    gzip_vary on;              # Vary: Accept-Encoding — corect pentru cache-uri
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;          # comprimă și când cererea vine prin proxy-ul din față
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # ─── Canonicalizare host + schemă ───────────────────────────────────────
    # `if` cu `return` e sigur (nu intră în categoria „if is evil", care se
    # referă la `if` cu conținut non rewrite-module).
    # 1) www → non-www (direct pe https, ca să nu facem două redirecturi)
    if ($host = "www.bizcheck.ua.com") {
        return 301 https://bizcheck.ua.com$request_uri;
    }
    # 2) http → https, DOAR dacă proxy-ul din față ne spune explicit că cererea
    #    a venit pe http. Health-check-ul intern (fără X-Forwarded-Proto) nu
    #    e afectat.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ─── ACME / verificări de domeniu ───────────────────────────────────────
    # OBLIGATORIU înaintea regulii `location ~ /\.` de mai jos. Prefixul `^~`
    # are prioritate peste orice `location` regex în nginx, deci `/.well-known/`
    # NU mai cade în `deny all`. Fără asta: Let's Encrypt http-01, verificările
    # de proprietate (Google/Meta), security.txt și apple-app-site-association
    # primesc 403.
    location ^~ /.well-known/ {
        allow all;
        root /usr/share/nginx/html;
        try_files $uri =404;
        default_type "text/plain";
        access_log off;
    }

    # ─── Redirecturi 301 pentru rutele vechi (pre-i18n) ─────────────────────
    # SPA-ul a trecut pe URL-uri localizate /uk/* și /en/*. Vechile căi rămân
    # permanente ca să nu pierdem link-uri și autoritate SEO.
    # `/` NU se redirecționează aici — alegerea limbii o face SPA-ul, ca să
    # respecte preferința utilizatorului (Accept-Language / localStorage).
    # Notă: SPA-ul păstrează și el aceleași redirecturi (<LegacyRedirect> în
    # App.tsx) ca plasă de siguranță. Cele de aici sunt 301-uri reale, deci
    # crawlerele nu mai văd un 200 urmat de un redirect JS.
    location = /confidentialitate {
        return 301 /uk/privacy;
    }
    location = /termeni {
        return 301 /uk/privacy;
    }
    location ~ ^/sablon/(.+)$ {
        return 301 /uk/templates/$1;
    }
    location ~ ^/plata/([^/]+)/(.+)$ {
        return 301 /uk/checkout/$1/$2;
    }
    location ~ ^/test/(.+)$ {
        return 301 /uk/test/$1;
    }

    # ─── Fișiere SEO servite ca fișiere reale ───────────────────────────────
    # `try_files $uri =404` (nu fallback pe index.html): dacă lipsesc, vrem un
    # 404 adevărat, nu un soft-404 cu HTML-ul SPA-ului — Googlebot îl parsează
    # ca sitemap invalid.
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Health probe expus prin proxy ──────────────────────────────────────
    # Backendul îl publică pe /api/health (vezi backend/server.py) — path care
    # NU e sub /api_crowe_bizcheck/, deci nu ajungea niciodată prin nginx.
    # Alias-ul de mai jos îl face accesibil pentru smoke-testul din deploy.sh
    # și pentru monitorizare externă. Răspunsul e {"status":"ok"} — fără date.
    location = /api_crowe_bizcheck/health {
        proxy_pass http://backend:4001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
        access_log off;
    }

    # ─── Proxy API către backend ────────────────────────────────────────────
    location /api_crowe_bizcheck/ {
        client_max_body_size 25m;
        proxy_pass http://backend:4001/api_crowe_bizcheck/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Override X-Forwarded-For (do NOT append to client-supplied chain).
        # Otherwise an attacker can poison the chain with a fake leading IP and
        # bypass rate limits keyed on a parsed XFF. Backend reads only the
        # last hop via ProxyFix(x_for=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Headere de securitate garantate și pe calea de API. Flask le pune deja
        # (server.py: set_security_headers), dar dacă backendul cade sau nginx
        # generează el eroarea (502/504), răspunsul ar pleca fără ele.
        # proxy_hide_header + add_header = exact UN header, nu duplicate.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── PDF-uri statice (preview, outro) ───────────────────────────────────
    # `^~` ca să nu le fure vreun `location` regex de mai jos. Always revalidate
    # so design updates deploy within seconds (nginx răspunde 304 dacă nu s-au
    # schimbat).
    location ^~ /pdf/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Asset-uri statice cu hash de conținut (Vite) ───────────────────────
    # Lista extinsă: formatele moderne de imagine (webp/avif), fonturile
    # (ttf/eot), gif/jpeg și source-map-urile lipseau și cădeau pe „no-cache".
    location ~* \.(js|mjs|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # ─── Blochează fișierele ascunse ────────────────────────────────────────
    # ATENȚIE: `/.well-known/` e scos deasupra printr-un `location ^~`, care are
    # prioritate peste acest regex. Nu modifica regexul de aici — mută excepțiile
    # în blocuri `^~` de mai sus.
    location ~ /\. {
        deny all;
    }

    # ─── SPA (React Router) ─────────────────────────────────────────────────
    # try_files servește index.html pentru orice rută client-side, inclusiv
    # /uk/*, /en/* și /admin_bizcheck_md_crowe/*.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        # X-Frame-Options: DENY a fost eliminat ca Meta Event Setup Tool să poată
        # încărca site-ul într-un iframe. Framing-ul e controlat acum de directiva
        # frame-ancestors din CSP (de mai jos), care permite *.facebook.com / *.facebook.net.
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS: forțează HTTPS în browser 1 an (proxy-ul din față termină TLS, dar headerul
        # ajunge la client prin proxy). Răspunde la finding-ul „HSTS отсутствует" din pentest.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: documentul HTML (index.html) e servit de nginx, deci aici trebuie permis
        # Meta Pixel: script-src primește 'unsafe-inline' (snippet-ul inline) +
        # connect.facebook.net (fbevents.js) + www.facebook.com; connect-src primește
        # beacon-urile Facebook; frame-ancestors permite framing-ul de Facebook (Event
        # Setup Tool). Telegram rămâne în allow-list.
        # Yandex Metrica (mc.yandex.ru + wss://mc.yandex.ru) a fost ELIMINAT din
        # script-src/connect-src: serviciul e blocat în Ucraina și tracker-ul a fost
        # scos din frontend. Nu-l adăuga înapoi.
        # worker-src 'self' blob: rămâne — generatorul de PDF din client pornește
        # workeri din blob.
        # Host-ul API nu are nevoie de intrare proprie: SPA-ul cheamă backendul prin
        # path relativ (/api_crowe_bizcheck, vezi src/config/api.ts), deci e acoperit
        # de 'self'. Fonturile sunt din stack-ul de sistem (Helvetica/Arial —
        # standardul Crowe), deci nu permitem fonts.google*.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org https://connect.facebook.net https://www.facebook.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://telegram.org https://www.facebook.com https://connect.facebook.net; worker-src 'self' blob:; frame-src https://oauth.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.facebook.com https://*.facebook.net" always;
    }
}
