# ═══════════════════════════════════════════════════════════════════════════
#  BizCheck — nginx pentru SPA + proxy către backend
#  Fișierul e montat ca /etc/nginx/conf.d/default.conf (deci context `http`).
#
#  TLS NU se termină aici. În fața acestui container stă un reverse-proxy
#  extern (`nginx_proxy`) care ține certificatele Let's Encrypt. Configul
#  recomandat pentru ACEL proxy (443 ssl + http2 + redirect 80→443) e
#  versionat separat în `nginx-proxy.conf.example` — vezi acolo.
#
#  Din acest motiv aici NU există `listen 443 ssl` și nici `http2 on`:
#  proxy-ul din față vorbește HTTP/1.1 în clar pe rețeaua Docker. Redirectul
#  http→https se face condiționat, pe baza X-Forwarded-Proto (dacă proxy-ul
#  nu trimite headerul, nu se redirecționează nimic → setup-ul actual rămâne
#  funcțional).
#
# ═══════════════════════════════════════════════════════════════════════════
#  MASCA DE PRE-LANSARE  (Basic Auth + noindex)  — UN SINGUR COMUTATOR
# ═══════════════════════════════════════════════════════════════════════════
#  Cât timp site-ul e „în pregătire" nu vrem nici vizitatori, nici crawlere.
#  Mecanismul: în locațiile care servesc CONȚINUT există linia
#
#      include /etc/nginx/maintenance/*.conf;
#
#  Directorul e BIND MOUNT de pe gazdă (`./nginx-maintenance` → vezi
#  docker-compose.yml, serviciul `frontend`). Comutatorul e existența unui
#  singur fișier acolo:
#
#      nginx-maintenance/mask.conf   există  → mască PORNITĂ
#                                    lipsește → mască OPRITĂ
#
#  Se pune / se scoate cu:   ./scripts/site-mask.sh on|off|status|adduser
#
#  De ce `include` cu wildcard și nu `if`:
#    * nginx NU are un `if` sigur pentru a activa `auth_basic` (directiva nu e
#      permisă în `if`, iar „if is evil" se referă exact la astfel de folosiri);
#    * un `include` cu glob care nu găsește nimic e OK în nginx (glob(3) →
#      GLOB_NOMATCH, tratat ca succes) — deci configul e valid și fără fișier,
#      ba chiar și fără directorul montat. Imaginea rămâne pornibilă standalone.
#    * fiind bind mount, comutarea NU cere rebuild de imagine (nginx.conf e
#      COPIAT în imagine — vezi runbook §10.1), doar `nginx -s reload`.
#
#  CE CONȚINE mask.conf (generat de scripts/site-mask.sh, sursă unică):
#      auth_basic          → cererea de user/parolă
#      auth_basic_user_file→ /etc/nginx/maintenance/htpasswd (NU e în git)
#      add_header X-Robots-Tag "noindex, …" always
#
#  ⚠ CELE DOUĂ SUNT ÎN ACELAȘI FIȘIER, INTENȚIONAT. Capcana clasică e să scoți
#    parola la lansare și să uiți `noindex` în producție → site invizibil în
#    Google la nesfârșit. Aici nu ai ce uita: același `rm` le scoate pe amândouă.
#    `deploy.sh` verifică în plus, la fiecare deploy, că starea reală a
#    răspunsului HTTP corespunde stării comutatorului (401 + noindex, sau
#    200 + fără noindex) și se oprește zgomotos dacă cele două au divergat.
#
#  DE CE `include` în FIECARE locație și nu o dată la nivel de `server`:
#    `auth_basic` s-ar moșteni corect, dar `add_header` NU: nginx moștenește
#    add_header de la nivelul superior DOAR dacă nivelul curent nu are niciun
#    add_header propriu. Toate locațiile de conținut de aici au add_header-e
#    proprii (CSP, HSTS, nosniff…), deci un X-Robots-Tag pus la nivel de
#    `server` ar fi tăcut ignorat. Include-ul local le pune la ACELAȘI nivel.
#
#  `always` pe X-Robots-Tag e obligatoriu: fără el add_header se aplică doar
#  la 200/201/204/301/302/303/304/307/308 — adică exact NU la 401, care e tot
#  ce vede un crawler cât timp masca e pornită.
#
#  CE RĂMÂNE DELIBERAT NEPROTEJAT (nu adăuga include-ul acolo):
#    /.well-known/                 → ACME http-01. Blocarea lui oprește
#                                    REÎNNOIREA certificatului → TLS expiră în
#                                    90 de zile și site-ul pică. Cel mai grav.
#    /healthz                      → healthcheck-ul Docker al containerului.
#    /api_crowe_bizcheck/health    → smoke-testul din deploy.sh + monitorizare.
#    /robots.txt                   → trebuie să rămână CITIBIL (vezi comentariul
#                                    de la locația lui).
#  Boții Telegram nu sunt afectați: vorbesc direct cu `http://backend:4001`
#  în rețeaua Docker (tgbot/config.py:23, groupbot/bot.py:63), nu prin nginx.
# ═══════════════════════════════════════════════════════════════════════════

server {
    server_tokens off;  # hide nginx version (CWE-200)
    listen 80 default_server;
    server_name bizcheck.ua.com www.bizcheck.ua.com;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    # ─── Compresie ──────────────────────────────────────────────────────────
    # nginx:alpine vine cu gzip OFF. Fără asta HTML/CSS/JS pleacă necomprimate.
    # text/html e mereu comprimat implicit și NU se pune în gzip_types.
    gzip on;
    gzip_vary on;              # Vary: Accept-Encoding — corect pentru cache-uri
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;          # comprimă și când cererea vine prin proxy-ul din față
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # ─── Canonicalizare host + schemă ───────────────────────────────────────
    # `if` cu `return` e sigur (nu intră în categoria „if is evil", care se
    # referă la `if` cu conținut non rewrite-module).
    # 1) www → non-www (direct pe https, ca să nu facem două redirecturi)
    if ($host = "www.bizcheck.ua.com") {
        return 301 https://bizcheck.ua.com$request_uri;
    }
    # 2) http → https, DOAR dacă proxy-ul din față ne spune explicit că cererea
    #    a venit pe http. Health-check-ul intern (fără X-Forwarded-Proto) nu
    #    e afectat.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ─── ACME / verificări de domeniu ───────────────────────────────────────
    # OBLIGATORIU înaintea regulii `location ~ /\.` de mai jos. Prefixul `^~`
    # are prioritate peste orice `location` regex în nginx, deci `/.well-known/`
    # NU mai cade în `deny all`. Fără asta: Let's Encrypt http-01, verificările
    # de proprietate (Google/Meta), security.txt și apple-app-site-association
    # primesc 403.
    #
    # ⚠ NU pune aici include-ul măștii de pre-lansare. Un 401 pe
    #   /.well-known/acme-challenge/ face ca `certbot renew` să eșueze; nimeni
    #   nu observă până când certificatul expiră (90 de zile) și tot site-ul
    #   pică pe eroare TLS. În setupul actual challenge-ul e servit oricum de
    #   proxy-ul din față din /var/www/certbot (nginx-proxy.conf.example:43),
    #   deci masca nu-l atinge — dar locația rămâne deschisă și aici ca să nu
    #   se rupă nimic dacă cineva mută vreodată webroot-ul în container.
    location ^~ /.well-known/ {
        allow all;
        root /usr/share/nginx/html;
        try_files $uri =404;
        default_type "text/plain";
        # RFC 9116 §3 cere ca security.txt să fie servit ca
        # `text/plain; charset=utf-8`. mime.types dă deja text/plain pentru
        # .txt, dar NU adaugă charset-ul — de aici linia asta. `charset` se
        # aplică implicit doar tipurilor din charset_types (text/plain inclus),
        # deci nu afectează alte fișiere .well-known (ex. JSON pentru
        # apple-app-site-association).
        charset utf-8;
        access_log off;
    }

    # ─── Redirecturi 301 pentru rutele vechi (pre-i18n) ─────────────────────
    # SPA-ul a trecut pe URL-uri localizate /uk/* și /en/*. Vechile căi rămân
    # permanente ca să nu pierdem link-uri și autoritate SEO.
    # `/` NU se redirecționează aici — alegerea limbii o face SPA-ul, ca să
    # respecte preferința utilizatorului (Accept-Language / localStorage).
    # Notă: SPA-ul păstrează și el aceleași redirecturi (<LegacyRedirect> în
    # App.tsx) ca plasă de siguranță. Cele de aici sunt 301-uri reale, deci
    # crawlerele nu mai văd un 200 urmat de un redirect JS.
    location = /confidentialitate {
        return 301 /uk/privacy;
    }
    location = /termeni {
        return 301 /uk/privacy;
    }
    location ~ ^/sablon/(.+)$ {
        return 301 /uk/templates/$1;
    }
    location ~ ^/plata/([^/]+)/(.+)$ {
        return 301 /uk/checkout/$1/$2;
    }
    location ~ ^/test/(.+)$ {
        return 301 /uk/test/$1;
    }

    # ─── Fișiere SEO servite ca fișiere reale ───────────────────────────────
    # `try_files $uri =404` (nu fallback pe index.html): dacă lipsesc, vrem un
    # 404 adevărat, nu un soft-404 cu HTML-ul SPA-ului — Googlebot îl parsează
    # ca sitemap invalid.
    #
    # robots.txt rămâne PUBLIC și crawlabil chiar și cu masca pornită — este
    # intenționat, nu o scăpare.
    #   * `Disallow: /` NU înseamnă „nu indexa". Înseamnă „nu descărca". Un URL
    #     descoperit din altă parte (backlink, bară de adrese a unui browser cu
    #     sincronizare, sitemap vechi) poate ajunge tot în index, ca rezultat
    #     „fără descriere" — exact capcana clasică.
    #   * Mai rău: dacă blochezi crawlingul, Googlebot nu mai poate CITI
    #     `X-Robots-Tag: noindex` de pe răspuns, deci semnalul care chiar
    #     dezindexează nu ajunge niciodată la el. Blocarea slăbește noindex-ul.
    # Deci: 401 pe tot conținutul (nu se scurge nimic) + `noindex` pe acel 401
    # (semnal explicit) + robots.txt lăsat citibil ca semnalul să fie vizibil.
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    # sitemap.xml, în schimb, INTRĂ sub mască: e o listă de URL-uri gata de
    # descoperit. Cu masca pornită întoarce 401 și nu mai alimentează crawlerele.
    location = /sitemap.xml {
        include /etc/nginx/maintenance/*.conf;   # masca de pre-lansare (vezi antetul)
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Health probe LOCAL al containerului de frontend ────────────────────
    # Healthcheck-ul Docker al serviciului `frontend` lovea `/`, care intră sub
    # masca de pre-lansare → ar primi 401 → container „unhealthy" → deploy.sh
    # face rollback la fiecare deploy cu masca pornită. De aceea proba are acum
    # o locație proprie, care NU include masca.
    #
    # `try_files /index.html =503` (nu `return 200`): păstrează exact semantica
    # de dinainte — 200 doar dacă build-ul SPA-ului chiar e în imagine; dacă
    # `dist` lipsește sau e corupt, iese 503 și containerul devine unhealthy,
    # cum trebuie. Nu proxyază spre backend, deci frontendul rămâne „healthy"
    # și când backendul e picat (decizia din docker-compose.yml).
    location = /healthz {
        try_files /index.html =503;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;   # nu e conținut
        access_log off;
    }

    # ─── Health probe expus prin proxy ──────────────────────────────────────
    # Backendul îl publică pe /api/health (vezi backend/server.py) — path care
    # NU e sub /api_crowe_bizcheck/, deci nu ajungea niciodată prin nginx.
    # Alias-ul de mai jos îl face accesibil pentru smoke-testul din deploy.sh
    # și pentru monitorizare externă. Răspunsul e {"status":"ok"} — fără date.
    #
    # ⚠ NU intră sub masca de pre-lansare. E o locație `=` (exact match), deci
    #   are prioritate peste prefixul `/api_crowe_bizcheck/` de mai jos și NU
    #   moștenește nimic de la el. Dacă ar fi protejată: `smoke()` din deploy.sh
    #   ar primi 401 în loc de 200 → ROLLBACK automat la fiecare deploy.
    #   Nu expune nimic — răspunsul e literalmente {"status":"ok"}.
    location = /api_crowe_bizcheck/health {
        proxy_pass http://backend:4001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
        access_log off;
    }

    # ─── Proxy API către backend ────────────────────────────────────────────
    location /api_crowe_bizcheck/ {
        # Masca acoperă și API-ul, nu doar HTML-ul: altfel conținutul testelor,
        # al șabloanelor și al setărilor rămâne descărcabil ca JSON de oricine,
        # iar panoul de admin ar fi „protejat" doar la nivel de pagină.
        # Browserul retrimite singur credențialele Basic pe tot originul după
        # prima autentificare, deci SPA-ul (public ȘI admin) funcționează normal.
        # Boții NU trec pe aici (merg direct la backend:4001), deci nu se rup.
        include /etc/nginx/maintenance/*.conf;   # masca de pre-lansare (vezi antetul)
        client_max_body_size 25m;
        proxy_pass http://backend:4001/api_crowe_bizcheck/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Override X-Forwarded-For (do NOT append to client-supplied chain).
        # Otherwise an attacker can poison the chain with a fake leading IP and
        # bypass rate limits keyed on a parsed XFF. Backend reads only the
        # last hop via ProxyFix(x_for=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Headere de securitate garantate și pe calea de API. Flask le pune deja
        # (server.py: set_security_headers), dar dacă backendul cade sau nginx
        # generează el eroarea (502/504), răspunsul ar pleca fără ele.
        # proxy_hide_header + add_header = exact UN header, nu duplicate.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── PDF-uri statice (preview, outro) ───────────────────────────────────
    # `^~` ca să nu le fure vreun `location` regex de mai jos. Always revalidate
    # so design updates deploy within seconds (nginx răspunde 304 dacă nu s-au
    # schimbat).
    location ^~ /pdf/ {
        include /etc/nginx/maintenance/*.conf;   # masca de pre-lansare (vezi antetul)
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Asset-uri statice cu hash de conținut (Vite) ───────────────────────
    # Lista extinsă: formatele moderne de imagine (webp/avif), fonturile
    # (ttf/eot), gif/jpeg și source-map-urile lipseau și cădeau pe „no-cache".
    location ~* \.(js|mjs|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico|map)$ {
        # Fără mască aici, bundle-ul JS al SPA-ului (adică tot site-ul) ar fi
        # descărcabil direct, iar un ecran de login făcut în React ar fi complet
        # inutil. Ăsta e motivul pentru care masca stă în nginx, nu în SPA.
        include /etc/nginx/maintenance/*.conf;   # masca de pre-lansare (vezi antetul)
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # ─── Blochează fișierele ascunse ────────────────────────────────────────
    # ATENȚIE: `/.well-known/` e scos deasupra printr-un `location ^~`, care are
    # prioritate peste acest regex. Nu modifica regexul de aici — mută excepțiile
    # în blocuri `^~` de mai sus.
    location ~ /\. {
        deny all;
    }

    # ─── SPA (React Router) ─────────────────────────────────────────────────
    # try_files servește index.html pentru orice rută client-side, inclusiv
    # /uk/*, /en/* și /admin_bizcheck_md_crowe/*.
    location / {
        # Masca de pre-lansare. Acoperă și `/admin_bizcheck_md_crowe/*`, care e
        # servit tot de aici (SPA fallback) — DELIBERAT:
        #   * a-l scuti ar cere un `location ^~ /admin_bizcheck_md_crowe/` care
        #     duplică CSP-ul și restul headerelor de mai jos → două locuri care
        #     divergă în tăcere;
        #   * n-ar ajuta oricum: panoul cheamă `/api_crowe_bizcheck/`, care e
        #     sub mască;
        #   * dubla autentificare e un câștig, nu un cost: pagina de login a
        #     panoului nu mai e nici accesibilă public, nici atacabilă prin
        #     forță brută, iar operatorul are oricum parola. Browserul o cere
        #     o singură dată pe sesiune.
        include /etc/nginx/maintenance/*.conf;   # masca de pre-lansare (vezi antetul)
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        # X-Frame-Options: DENY a fost eliminat ca Meta Event Setup Tool să poată
        # încărca site-ul într-un iframe. Framing-ul e controlat acum de directiva
        # frame-ancestors din CSP (de mai jos), care permite *.facebook.com / *.facebook.net.
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS: forțează HTTPS în browser 1 an (proxy-ul din față termină TLS, dar headerul
        # ajunge la client prin proxy). Răspunde la finding-ul „HSTS отсутствует" din pentest.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: documentul HTML (index.html) e servit de nginx, deci aici trebuie permis
        # Meta Pixel: script-src primește 'unsafe-inline' (snippet-ul inline) +
        # connect.facebook.net (fbevents.js) + www.facebook.com; connect-src primește
        # beacon-urile Facebook; frame-ancestors permite framing-ul de Facebook (Event
        # Setup Tool). Telegram rămâne în allow-list.
        # Yandex Metrica (mc.yandex.ru + wss://mc.yandex.ru) a fost ELIMINAT din
        # script-src/connect-src: serviciul e blocat în Ucraina și tracker-ul a fost
        # scos din frontend. Nu-l adăuga înapoi.
        # worker-src 'self' blob: rămâne — generatorul de PDF din client pornește
        # workeri din blob.
        # Host-ul API nu are nevoie de intrare proprie: SPA-ul cheamă backendul prin
        # path relativ (/api_crowe_bizcheck, vezi src/config/api.ts), deci e acoperit
        # de 'self'. Fonturile sunt din stack-ul de sistem (Helvetica/Arial —
        # standardul Crowe), deci nu permitem fonts.google*.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org https://connect.facebook.net https://www.facebook.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://telegram.org https://www.facebook.com https://connect.facebook.net; worker-src 'self' blob:; frame-src https://oauth.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://*.facebook.com https://*.facebook.net" always;
    }
}
